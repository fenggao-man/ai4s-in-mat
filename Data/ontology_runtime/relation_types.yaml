version: 0.3.0
status: active
design: entity_centric
description: >
  从 v0.2.0 的 54 条"有X"结构关系收敛为 15 条语义关系。
  每条关系表达真实科研逻辑，而非仅仅复制节点层级结构。

relation_types:
  # ── 文档层 ──
  - name: 提及
    source_types: [文档]
    target_types: [催化剂]

  # ── 组成关系 ──
  - name: 含有活性组分
    source_types: [催化剂]
    target_types: [化学物质]
    description: 催化剂含有某种活性组分

  - name: 使用前驱体
    source_types: [催化剂]
    target_types: [化学物质]
    description: 催化剂使用某种前驱体

  - name: 负载于
    source_types: [催化剂]
    target_types: [化学物质]
    description: 催化剂负载在某种载体上

  - name: 添加助剂
    source_types: [催化剂]
    target_types: [助剂]
    description: 催化剂添加了某种助剂

  # ── 制备关系 ──
  - name: 制备于
    source_types: [催化剂]
    target_types: [制备步骤]
    description: 催化剂的第一个制备步骤

  - name: 下一步
    source_types: [制备步骤]
    target_types: [制备步骤]
    description: 制备步骤的先后顺序

  - name: 消耗
    source_types: [制备步骤]
    target_types: [化学物质]
    description: 制备步骤消耗的原料
    edge_properties:
      - name: role
        type: string
        description: 该物质在此步骤中的角色（reactant / solvent / catalyst / reagent / additive）

  - name: 产出
    source_types: [制备步骤]
    target_types: [化学物质]
    description: 制备步骤产出的物质
    edge_properties:
      - name: description
        type: string
        description: 产物形态描述（如 precipitate / solution / calcined solid）

  # ── 测试关系 ──
  - name: 测试于
    source_types: [催化剂]
    target_types: [测试]
    description: 催化剂在某种条件下进行了性能测试

  # ── 表征关系 ──
  - name: 表征于
    source_types: [催化剂]
    target_types: [表征]
    description: 催化剂通过某种方法进行了表征

  - name: 证实
    source_types: [表征]
    target_types: [化学物质]
    description: 表征结果证实了某种化学物种或晶相的存在

  # ── 机理关系 ──
  - name: 有机理
    source_types: [催化剂]
    target_types: [机理]
    description: 催化剂的反应机理描述

  # ── 跨域关系 ──
  - name: 促进
    source_types: [助剂]
    target_types: [机理]
    description: 助剂对反应机理的促进作用

  - name: 影响性能
    source_types: [助剂]
    target_types: [测试]
    description: 助剂对催化性能的影响
