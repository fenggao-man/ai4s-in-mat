version: 0.3.0
status: active
design: entity_centric
description: >
  从 v0.2.0 两层节点体系重构为实体中心模型。
  数值型子节点不再作为独立节点，而是作为父实体的属性字段。
  表征方法收敛为单一"表征"类型，方法名作为属性。

node_types:
  - name: 文档
    unique_key: [doc_id]
    properties:
      - name: doc_id
        type: string
      - name: title
        type: string
      - name: source
        type: string
      - name: filename
        type: string

  - name: 催化剂
    unique_key: [name, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: name
        type: string
      - name: active_component
        type: string
      - name: precursor
        type: string
      - name: crystal_phase
        type: string
      - name: iron_ratio_value
        type: string
      - name: iron_ratio_unit
        type: string
      - name: surface_area_value
        type: string
      - name: surface_area_unit
        type: string
      - name: pore_structure
        type: string
      - name: particle_size_value
        type: string
      - name: particle_size_unit
        type: string
      - name: preparation_method
        type: string
      - name: mechanical_strength_value
        type: string
      - name: mechanical_strength_unit
        type: string
      - name: support
        type: string
      - name: source_text
        type: string
      - name: note
        type: string

  - name: 化学物质
    unique_key: [name, formula, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: name
        type: string
      - name: formula
        type: string
      - name: role
        type: string
      - name: catalyst_name
        type: string
      - name: source_text
        type: string
      - name: note
        type: string

  - name: 助剂
    unique_key: [name, catalyst_name, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: catalyst_name
        type: string
      - name: name
        type: string
      - name: content_value
        type: string
      - name: content_unit
        type: string
      - name: promoter_type
        type: string
      - name: addition_method
        type: string
      - name: source_text
        type: string
      - name: note
        type: string

  - name: 制备步骤
    unique_key: [step_order, catalyst_name, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: catalyst_name
        type: string
      - name: step_order
        type: integer
      - name: step_name
        type: string
      - name: method
        type: string
      - name: temperature_value
        type: string
      - name: temperature_unit
        type: string
      - name: duration
        type: string
      - name: atmosphere
        type: string
      - name: description
        type: string
      - name: inputs
        type: string
        description: 该步骤消耗的化学物质名称列表（逗号分隔，如 "Fe₃O₄, Al₂O₃"）
      - name: outputs
        type: string
        description: 该步骤产出的化学物质名称列表（逗号分隔，如 "Fe₃O₄/Al₂O₃前驱体"）
      - name: source_text
        type: string

  - name: 测试
    unique_key: [catalyst_name, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: catalyst_name
        type: string
      - name: temperature_value
        type: string
      - name: temperature_unit
        type: string
      - name: pressure_value
        type: string
      - name: pressure_unit
        type: string
      - name: ghsv_value
        type: string
      - name: ghsv_unit
        type: string
      - name: h2_n2_ratio
        type: string
      - name: feed_composition
        type: string
      - name: gas_purity
        type: string
      - name: duration_value
        type: string
      - name: duration_unit
        type: string
      - name: nh3_activity_value
        type: string
      - name: nh3_activity_unit
        type: string
      - name: conversion
        type: string
      - name: selectivity
        type: string
      - name: stability
        type: string
      - name: lifetime
        type: string
      - name: toxicity_resistance
        type: string
      - name: source_text
        type: string
      - name: note
        type: string

  - name: 表征
    unique_key: [method, catalyst_name, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: catalyst_name
        type: string
      - name: method
        type: string
      - name: result_summary
        type: string
      - name: confirmed_phase
        type: string
      - name: source_text
        type: string
      - name: note
        type: string

  - name: 机理
    unique_key: [aspect, catalyst_name, doc_id]
    properties:
      - name: doc_id
        type: string
      - name: catalyst_name
        type: string
      - name: aspect
        type: string
      - name: value
        type: string
      - name: unit
        type: string
      - name: description
        type: string
      - name: source_text
        type: string
      - name: note
        type: string
