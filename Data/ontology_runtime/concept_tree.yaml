version: 0.3.0
status: active
description: >
  v0.3.0 概念树反映实体-关系模型。
  不再有 parent→child 的属性嵌套，而是通过语义关系连接实体。

concept_tree:
  - entity: 催化剂
    related_via:
      - relation: 含有活性组分
        target: 化学物质
      - relation: 使用前驱体
        target: 化学物质
      - relation: 负载于
        target: 化学物质
      - relation: 添加助剂
        target: 助剂
      - relation: 制备于
        target: 制备步骤
      - relation: 测试于
        target: 测试
      - relation: 表征于
        target: 表征
      - relation: 有机理
        target: 机理

  - entity: 制备步骤
    related_via:
      - relation: 消耗
        target: 化学物质
      - relation: 产出
        target: 化学物质
      - relation: 下一步
        target: 制备步骤

  - entity: 表征
    related_via:
      - relation: 证实
        target: 化学物质

  - entity: 助剂
    related_via:
      - relation: 促进
        target: 机理
      - relation: 影响性能
        target: 测试

  - entity: 测试
    related_via: []

  - entity: 机理
    related_via: []

  - entity: 化学物质
    related_via: []

  - entity: 文档
    related_via:
      - relation: 提及
        target: 催化剂
